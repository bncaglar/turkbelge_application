name: turkbelge_application
description: A new Flutter application.


publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  intl: ^0.17.0

  #for responsive UI
  sizer: ^2.0.13

  #Logger mechanism
  logger: ^1.0.0

  #firebase
  firebase_core: ^1.7.0
  firebase_auth: ^3.1.2
  cloud_firestore: ^2.5.3

  #phone number textfield
  intl_phone_number_input: ^0.7.0+2

  #provider
  provider: ^5.0.0

  #bloc state management
  flutter_bloc: ^7.1.0

  #countdown indicator
  countdown_progress_indicator: ^0.1.0

  #shared preferences
  shared_preferences: ^2.0.6

  #emailsender
  flutter_email_sender: ^5.0.2

  #chart
  fl_chart: ^0.36.3

  #get wifi info
  wifi_info_flutter: ^2.0.2

  #preview the application on various devices

  #check internet connection
  connectivity: ^3.0.6

  url_launcher: ^6.0.9
  http: ^0.13.3
  xml: ^5.3.0
  xml2json: ^5.3.1
  flutter_native_splash: ^1.3.1
  flutter_slidable: ^0.6.0
  firebase_messaging: ^10.0.8
  awesome_dialog: ^2.1.1
  pdf: ^3.6.1
  get: ^4.3.8
  flutter_svg: ^0.23.0+1
  number_slide_animation: ^0.2.1
  syncfusion_flutter_charts: ^19.3.46
  flutter_switch: ^0.3.2
  path_provider: ^2.0.6
  flutter_launcher_icons: ^0.9.2
  anim_search_bar: ^2.0.2
  dropdown_below: ^1.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter


flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"

flutter_native_splash:
  background_image: assets/splash_whole.png
  android: true
  ios: true
  fill: true
  android_disable_fullscreen: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - svg/

